name: GitHub Snake Game

on:
  # Schedule the workflow to run daily at midnight UTC
  schedule:
    - cron: "0 0 * * *"

  # Allow manual triggering of the workflow
  workflow_dispatch:

  # Trigger the workflow on pushes to the main branch (Optional, consider removing if only scheduled/manual is needed)
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # --- ADD THIS PERMISSIONS BLOCK ---
    permissions:
      contents: write # This grants write access to the GITHUB_TOKEN
      pages: write # If you plan to use GitHub Pages for deployment, though not directly for this 'output' branch scenario, it's good practice.
      id-token: write # Required for OIDC, which is often used by actions internally.
    # ---------------------------------

    steps:
      # Step 1: Checkout the repository - Use v4 for better permission handling
      - name: Checkout Repository
        uses: actions/checkout@v4 # Changed from v3 to v4

      # Step 2: Generate the snake animations
      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk@v3
        with:
          # GitHub username to generate the animation for
          github_user_name: ${{ github.repository_owner }}

          # Define the output files and their configurations
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9
        # The GITHUB_TOKEN here is for Platane/snk to read contributions, which typically only needs read access,
        # but including it consistently is fine. The crucial write permission is at the job level.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Deploy the generated files to the 'output' branch
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          # Optionally, you can set a custom commit message
          commit_message: "Update snake animation [skip ci]"
